name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build-intel-wifi:
    name: Build (Intel WiFi)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory and zip files
        run: |
          mkdir -p Output
          zip --exclude '*.git*' --exclude '*.github*' --exclude '*Output*' -r -X "Output/${{ github.event.repository.name }}-${{github.ref_name}}-Intel-WiFi.zip" .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Intel-WiFi-Build
          path: Output/*.zip
          retention-days: 7

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.zip

  build-no-wifi:
    name: Build (no WiFi / HoRNDIS / native AirPort)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure plist settings
        run: |
          plutil -replace "Kernel"."Add".16."Enabled" -bool true EFI/OC/config.plist
          plutil -replace "Kernel"."Add".20."Enabled" -bool true EFI/OC/config.plist
          plutil -replace "Kernel"."Add".25."Enabled" -bool true EFI/OC/config.plist
          plutil -replace "Kernel"."Add".26."Enabled" -bool true EFI/OC/config.plist

      - name: Create output directory and zip files
        run: |
          mkdir -p Output
          zip --exclude '*.git*' --exclude '*.github*' --exclude '*Output*' -r -X "Output/${{ github.event.repository.name }}-${{github.ref_name}}-no-WiFi-HoRNDIS.zip" .

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: No-WiFi-Build
          path: Output/*.zip
          retention-days: 7

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.zip

          
  test-artifacts:
    name: Download and Test Artifacts
    runs-on: ubuntu-latest
    needs: [build-intel-wifi, build-no-wifi]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          
      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts contents:"
          ls -la downloaded-artifacts/
          cd downloaded-artifacts
          for dir in */; do
            echo "Contents of $dir:"
            ls -la "$dir"
          done
      
      - name: Verify zip files
        run: |
          cd downloaded-artifacts
          find . -name "*.zip" -exec unzip -t {} \;
          
  build-universal:
    name: Universal Build
    runs-on: macos-14
    needs: [build-intel-wifi, build-no-wifi, test-artifacts]
    if: github.event_name == 'release'
    steps:
      - name: Create summary
        run: |
          echo "# Build Summary" > $GITHUB_STEP_SUMMARY
          echo "All builds completed successfully. The following builds are available:" >> $GITHUB_STEP_SUMMARY
          echo "- Intel WiFi" >> $GITHUB_STEP_SUMMARY
          echo "- No WiFi / HoRNDIS / native AirPort" >> $GITHUB_STEP_SUMMARY